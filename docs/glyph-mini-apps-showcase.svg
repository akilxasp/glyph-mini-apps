<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Glyph Mini Apps showcase</title>
  <desc id="desc">Six monochrome cards showing Snake, Garden, Shooter, Reaction, Notify Glyph, and Now Playing on a circular 13 by 13 Glyph Matrix.</desc>
  <defs>
    <pattern id="page-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d8d8d5"/></pattern>
    <pattern id="matrix-dots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="5.5" cy="5.5" r="1.35" fill="#252525"/></pattern>
    <symbol id="card-shell" viewBox="0 0 360 320">
      <rect width="360" height="320" rx="18" fill="#e5e5e2"/>
      <path d="M0 72h165c38 0 69 31 69 69v179M360 54H260v266M0 256h84c24 0 44 20 44 44v20M322 0v118c0 22 18 40 38 40" fill="none" stroke="#c8c8c4" stroke-width="1.5"/>
      <circle cx="49" cy="118" r="14" fill="none" stroke="#c8c8c4" stroke-width="1.5"/>
      <circle cx="49" cy="158" r="10" fill="none" stroke="#c8c8c4" stroke-width="1.5"/>
      <circle cx="180" cy="176" r="82" fill="#050505"/>
      <circle cx="180" cy="176" r="68" fill="url(#matrix-dots)"/>
    </symbol>
    <style>
      .name{font:700 16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.6px;fill:#171717}
      .meta{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.8px;fill:#696965}
      .px{fill:#fff}.dim{fill:#999}.red{fill:#d71920}
    </style>
  </defs>
  <rect width="1200" height="780" fill="#f4f4f1"/>
  <rect width="1200" height="780" fill="url(#page-dots)" opacity=".55"/>
  <text x="45" y="48" class="name" font-size="20">GLYPH MINI APPS</text>
  <text x="45" y="72" class="meta">SIX TINY EXPERIENCES FOR THE NOTHING PHONE (4A) PRO</text>

  <!-- Snake -->
  <g transform="translate(45 100)"><use href="#card-shell" width="360" height="320"/><text x="18" y="30" class="name">SNAKE</text><text x="18" y="51" class="meta">SELF-PLAYING</text>
    <g transform="translate(119 115)">
      <rect class="px" x="22" y="22" width="9" height="9"/><rect class="px" x="33" y="22" width="9" height="9"/><rect class="px" x="44" y="22" width="9" height="9"/><rect class="px" x="44" y="33" width="9" height="9"/><rect class="px" x="44" y="44" width="9" height="9"/><rect class="px" x="55" y="44" width="9" height="9"/><rect class="px" x="66" y="44" width="9" height="9"/><rect class="px" x="77" y="44" width="9" height="9"/><rect class="px" x="77" y="55" width="9" height="9"/><rect class="px" x="77" y="66" width="9" height="9"/><rect class="px" x="88" y="66" width="9" height="9"/><rect class="red" x="99" y="88" width="9" height="9"/>
    </g></g>

  <!-- Garden -->
  <g transform="translate(420 100)"><use href="#card-shell" width="360" height="320"/><text x="18" y="30" class="name">GARDEN</text><text x="18" y="51" class="meta">AMBIENT FLOWER</text>
    <g transform="translate(119 115)">
      <rect class="px" x="55" y="11" width="9" height="9"/><rect class="px" x="44" y="22" width="9" height="9"/><rect class="px" x="55" y="22" width="9" height="9"/><rect class="px" x="66" y="22" width="9" height="9"/><rect class="px" x="33" y="33" width="9" height="9"/><rect class="px" x="44" y="33" width="9" height="9"/><rect class="px" x="55" y="33" width="9" height="9"/><rect class="px" x="66" y="33" width="9" height="9"/><rect class="px" x="77" y="33" width="9" height="9"/><rect class="px" x="44" y="44" width="9" height="9"/><rect class="px" x="55" y="44" width="9" height="9"/><rect class="px" x="66" y="44" width="9" height="9"/><rect class="px" x="55" y="55" width="9" height="9"/><rect class="dim" x="55" y="66" width="9" height="9"/><rect class="dim" x="55" y="77" width="9" height="9"/><rect class="dim" x="44" y="77" width="9" height="9"/><rect class="dim" x="66" y="88" width="9" height="9"/><rect class="dim" x="55" y="99" width="9" height="9"/><rect class="dim" x="44" y="110" width="9" height="9"/>
    </g></g>

  <!-- Shooter -->
  <g transform="translate(795 100)"><use href="#card-shell" width="360" height="320"/><text x="18" y="30" class="name">SHOOTER</text><text x="18" y="51" class="meta">ESSENTIAL KEY</text>
    <g transform="translate(119 115)">
      <g class="px"><rect x="11" y="22" width="9" height="9"/><rect x="22" y="11" width="9" height="9"/><rect x="33" y="22" width="9" height="9"/><rect x="11" y="33" width="31" height="9"/><rect x="66" y="22" width="9" height="9"/><rect x="77" y="11" width="9" height="9"/><rect x="88" y="22" width="9" height="9"/><rect x="66" y="33" width="31" height="9"/><rect x="55" y="66" width="9" height="9"/><rect x="55" y="88" width="9" height="9"/><rect x="44" y="110" width="31" height="9"/><rect x="55" y="99" width="9" height="9"/></g>
    </g></g>

  <!-- Reaction -->
  <g transform="translate(45 435)"><use href="#card-shell" width="360" height="320"/><text x="18" y="30" class="name">REACTION</text><text x="18" y="51" class="meta">TEST YOUR SPEED</text>
    <g transform="translate(119 115)" class="px"><path d="M55 5h20L62 45h22L38 118l12-52H28z"/></g>
  </g>

  <!-- Notify Glyph -->
  <g transform="translate(420 435)"><use href="#card-shell" width="360" height="320"/><text x="18" y="30" class="name">NOTIFY GLYPH</text><text x="18" y="51" class="meta">APP ICON ALERTS</text>
    <g transform="translate(119 115)" class="px"><rect x="44" y="22" width="31" height="9"/><rect x="33" y="33" width="53" height="9"/><rect x="33" y="44" width="53" height="42"/><rect x="22" y="77" width="75" height="9"/><rect x="44" y="88" width="31" height="9"/><rect x="55" y="99" width="9" height="9"/></g>
    <circle cx="257" cy="106" r="8" class="red"/>
  </g>

  <!-- Now Playing -->
  <g transform="translate(795 435)"><use href="#card-shell" width="360" height="320"/><text x="18" y="30" class="name">NOW PLAYING</text><text x="18" y="51" class="meta">TITLE + ARTIST</text>
    <g transform="translate(119 115)" class="px"><rect x="66" y="16" width="9" height="66"/><rect x="77" y="16" width="31" height="9"/><rect x="99" y="25" width="9" height="46"/><rect x="44" y="71" width="31" height="9"/><rect x="33" y="80" width="42" height="20"/><rect x="77" y="60" width="31" height="9"/><rect x="77" y="69" width="31" height="20"/></g>
  </g>
</svg>
